<!doctype html>
<html lang="en">
  <head>
    <!-- ===== Fonts & Styles ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
    </style>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sayali Sawant | Growth & Product Analytics</title>

    <!-- ===== Tailwind (if used) ===== -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- ===== Root element for React app ===== -->
    <div id="root"></div>

    <!-- ===== React/Vite Entry Script ===== -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- ===== Netlify Identity Widget ===== -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      (function bootIdentity() {
        const hasRecovery = (window.location.hash || "").includes("recovery_token=");

        function initWhenReady() {
          if (!window.netlifyIdentity) {
            setTimeout(initWhenReady, 300);
            return;
          }

          window.netlifyIdentity.on("init", (user) => {
            if (!user && hasRecovery) {
              window.netlifyIdentity.open("login");
            }
          });

          // Fallback: if widget initialized before handler
          const current = window.netlifyIdentity.currentUser;
          if (!current && hasRecovery) {
            window.netlifyIdentity.open("login");
          }
        }

        initWhenReady();
      })();
    </script>
  </body>
</html>
